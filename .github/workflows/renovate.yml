name: Renovate
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      manual-trigger:
        description: 'Manually trigger Renovate'
        default: ''

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.2
        with:
          useSlim: false
          token: ${{ secrets.GITHUB_TOKEN }}
